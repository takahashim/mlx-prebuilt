name: build

# Builds the archive and attaches it to a release.
#
# On a tag it publishes; by hand it builds and keeps the result as an
# artifact, so the expensive part can be exercised without releasing
# anything. Not on every push: this is half an hour of compiling MLX, and
# nothing here changes between releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mlx_c_ref:
        description: "mlx-c tag or commit to build (it pins the MLX)"
        default: "v0.4.1"

permissions:
  contents: write

jobs:
  build:
    # Apple silicon, because these are arm64 archives and the Metal
    # kernels are compiled for the machine they will run on.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the Metal toolchain
        # Xcode is on the image; the Metal compiler is a component that
        # may not be, and MLX cannot be built with Metal without it.
        # Already-installed is not a failure.
        run: |
          xcodebuild -downloadComponent MetalToolchain || \
            echo "already present, or unavailable on this image"
          xcrun -sdk macosx metal --version

      - name: Build
        env:
          MLX_C_REF: ${{ github.event.inputs.mlx_c_ref || 'v0.4.1' }}
        run: ./build.sh

      - name: Name the archive after what is in it
        id: pack
        run: |
          mlx=$(awk '/^mlx /{print $2}' dist/MANIFEST.txt)
          mlxc=$(awk '/^mlx-c/{print $2}' dist/MANIFEST.txt)
          name="mlx-${mlx}-mlxc-${mlxc}-macos-arm64"
          mv dist "$name"
          tar -czf "$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$name.tar.gz" | tee "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.tar.gz
            ${{ steps.pack.outputs.name }}.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.name }}.tar.gz
            ${{ steps.pack.outputs.name }}.tar.gz.sha256
          body_path: ${{ steps.pack.outputs.name }}/MANIFEST.txt
          fail_on_unmatched_files: true
